<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="1040" height="260" fill="none" role="img" aria-label="ZineMap homepage hero">
  <title>ZineMap homepage header</title>
  <defs>
    <linearGradient id="zm-line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: 'Gloria Hallelujah';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://zinemap.com/fonts/GloriaHallelujah-Regular.woff2) format('woff2');
      }
      .zm-hero-title {
        font-family: 'Gloria Hallelujah', cursive;
        font-size: 48px;
        font-weight: 700;
        fill: #292524;
        letter-spacing: -0.025em;
      }
      .zm-hero-tag {
        font-family: 'Gloria Hallelujah', cursive;
        font-size: 19px;
        font-style: italic;
        fill: #57534e;
      }
    ]]></style>
  </defs>
  <rect width="520" height="130" fill="#ffffff"/>
  <!-- Equal gaps ~12px: title bottom → logo top, logo bottom → tagline top -->
  <text x="260" y="50" text-anchor="middle" class="zm-hero-title">ZineMap</text>
  <g transform="translate(260, 82)">
    <rect x="-72" y="-1" width="48" height="2" fill="url(#zm-line-fade)"/>
    <rect x="24" y="-1" width="48" height="2" fill="url(#zm-line-fade)"/>
    <g transform="translate(-12, -12)">
      <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 17L12 22L22 17" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 12L12 17L22 12" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="260" y="122" text-anchor="middle" class="zm-hero-tag">
    A collaborative map of the global zine scene.
  </text>
</svg>
